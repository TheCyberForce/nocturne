name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" -o "dist/noc-linux-$arch" ./cmd/noc
          done
          cd dist && sha256sum noc-linux-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Nocturne is a small, quiet VPN with its own protocol. See the README for a quick start and SPEC.md for the protocol.

          **Experimental:** the protocol has not been audited. Use it to learn and experiment, not to protect anything important.

          ## Install (Linux)

          ```sh
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/noc-linux-amd64
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          sudo install -m 755 noc-linux-amd64 /usr/local/bin/noc
          ```
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "Nocturne $GITHUB_REF_NAME" --notes-file notes.md
